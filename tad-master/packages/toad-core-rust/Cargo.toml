[package]
name = "toad-core"
version = "1.2.0"
edition = "2021"
authors = ["HelloKittyXamKinLung"]
description = "Native Rust Core Engine for Toad Viewer (EVTX, CSV Ingest, Portable AppData)"

[dependencies]
evtx = { version = "0.8.1", default-features = false, features = ["multithreading"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
