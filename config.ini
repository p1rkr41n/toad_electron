# Toad Portable Configuration File
# This file is automatically loaded on startup by Toad.

[general]
# Number of DuckDB worker threads ('auto' or integer >= 1)
duckdb_threads = auto

# Maximum memory ceiling for DuckDB ('auto' or size like '4GB', '8GB', etc.)
# 'auto' automatically enforces a safe ceiling (<= 45% of system RAM, max 8GB)
max_memory = auto

# Ingestion Parquet row group size (recommended: 100000 for SSD & HDD performance)
row_group_size = 100000

# Default pagination page size (default: 1000, no upper limit enforced, user discretion)
page_size = 1000
