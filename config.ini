# ==============================================================================
#                      TOAD VIEWER SYSTEM CONFIGURATION (CONFIG.INI)
# ==============================================================================

[general]
viewer = toad
language = en
page_size = 1000
max_concurrent_files = 4
max_concurrent_gb = 1

[duckdb]
max_memory = auto
threads = 0
background_threads = auto
add_raw_event = false

[parquet]
compression = snappy
row_group_size = 25000

[system]
temp_cleanup = true
binary_guard = true
